<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
  <title id="title">Kantrip database migration flow</title>
  <desc id="desc">A profile repository open either stays read-only for doctor, continues with a current schema, applies known pending migrations under a lock and transaction, or fails closed for invalid or future history.</desc>
  <style>
    :root { color-scheme: light dark; }
    .background { fill: #ffffff; }
    .node { fill: #f8fafc; stroke: #64748b; stroke-width: 2; }
    .core { fill: #eef2ff; stroke: #4f46e5; stroke-width: 2; }
    .action { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; }
    .decision { fill: #fefce8; stroke: #ca8a04; stroke-width: 2; }
    .ok { fill: #f0fdf4; stroke: #16a34a; stroke-width: 2; }
    .warn { fill: #fff7ed; stroke: #ea580c; stroke-width: 2; }
    .error { fill: #fef2f2; stroke: #dc2626; stroke-width: 2; }
    .activation { fill: #e0e7ff; stroke: #4f46e5; stroke-width: 1.5; }
    .boundary { fill: none; stroke: #16a34a; stroke-width: 1.5; stroke-dasharray: 8 6; }
    .line { fill: none; stroke: #475569; stroke-width: 2; marker-end: url(#arrow); }
    .connector { fill: none; stroke: #475569; stroke-width: 2; }
    .return { fill: none; stroke: #64748b; stroke-width: 1.5; stroke-dasharray: 6 5; marker-end: url(#arrow); }
    .lifeline { stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 7 7; }
    .title { fill: #0f172a; font: 700 24px system-ui, sans-serif; }
    .section { fill: #475569; font: 600 13px system-ui, sans-serif; text-anchor: middle; letter-spacing: .08em; }
    .label { fill: #0f172a; font: 600 16px system-ui, sans-serif; text-anchor: middle; }
    .detail { fill: #475569; font: 14px system-ui, sans-serif; text-anchor: middle; }
    .edge { fill: #475569; font: 600 13px system-ui, sans-serif; text-anchor: middle; }
    .boundary-label { fill: #15803d; font: 600 13px system-ui, sans-serif; }
    @media (prefers-color-scheme: dark) {
      .background { fill: #0f172a; }
      .node { fill: #1e293b; stroke: #94a3b8; }
      .core { fill: #312e81; stroke: #818cf8; }
      .action { fill: #172554; stroke: #60a5fa; }
      .decision { fill: #422006; stroke: #facc15; }
      .ok { fill: #052e16; stroke: #4ade80; }
      .warn { fill: #431407; stroke: #fb923c; }
      .error { fill: #450a0a; stroke: #f87171; }
      .activation { fill: #312e81; stroke: #818cf8; }
      .boundary { stroke: #4ade80; }
      .line, .connector, .return { stroke: #cbd5e1; }
      .lifeline { stroke: #64748b; }
      .title, .label { fill: #f8fafc; }
      .section, .detail, .edge { fill: #cbd5e1; }
      .boundary-label { fill: #4ade80; }
    }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect class="background" width="1200" height="660"/>
  <text class="title" x="40" y="44">Opening the profile repository</text>

  <rect class="node" x="40" y="90" width="220" height="76" rx="12"/>
  <text class="label" x="150" y="120">Open requested</text>
  <text class="detail" x="150" y="145">command + access mode</text>

  <polygon class="decision" points="460,70 610,128 460,186 310,128"/>
  <text class="label" x="460" y="122">Read-only</text>
  <text class="label" x="460" y="143">doctor?</text>
  <path class="line" d="M260 128 H310"/>

  <rect class="ok" x="760" y="90" width="360" height="76" rx="12"/>
  <text class="label" x="940" y="120">Validate and report</text>
  <text class="detail" x="940" y="145">no lock · no migration · no files created</text>
  <path class="line" d="M610 128 H760"/>
  <text class="edge" x="685" y="115">yes</text>

  <rect class="action" x="330" y="245" width="260" height="76" rx="12"/>
  <text class="label" x="460" y="275">Validate history</text>
  <text class="detail" x="460" y="300">checksums · sequence · pragma</text>
  <path class="line" d="M460 186 V245"/>
  <text class="edge" x="481" y="218">no</text>

  <rect class="ok" x="60" y="400" width="260" height="76" rx="12"/>
  <text class="label" x="190" y="430">Continue command</text>
  <text class="detail" x="190" y="455">schema is current</text>
  <path class="line" d="M330 283 H190 V400"/>
  <text class="edge" x="245" y="270">current</text>

  <rect class="warn" x="390" y="400" width="260" height="76" rx="12"/>
  <text class="label" x="520" y="430">Prepare migration</text>
  <text class="detail" x="520" y="455">maintenance lock + private backup</text>
  <path class="line" d="M460 321 V400"/>
  <text class="edge" x="520" y="365">known pending</text>

  <rect class="error" x="800" y="245" width="320" height="76" rx="12"/>
  <text class="label" x="960" y="275">Fail closed</text>
  <text class="detail" x="960" y="300">future, unknown, missing, or altered history</text>
  <path class="line" d="M590 283 H800"/>
  <text class="edge" x="695" y="270">invalid</text>

  <rect class="action" x="390" y="540" width="260" height="76" rx="12"/>
  <text class="label" x="520" y="570">Apply in sequence</text>
  <text class="detail" x="520" y="595">BEGIN IMMEDIATE · validate · commit</text>
  <path class="line" d="M520 476 V540"/>

  <rect class="ok" x="800" y="540" width="320" height="76" rx="12"/>
  <text class="label" x="960" y="570">Continue command</text>
  <text class="detail" x="960" y="595">history and user_version agree</text>
  <path class="line" d="M650 578 H800"/>
</svg>
