<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="840" viewBox="0 0 1200 840" role="img" aria-labelledby="title desc">
  <title id="title">Kantrip credential vault access</title>
  <desc id="desc">Before any item access Kantrip reads the vault state without prompting. An unlocked vault is used. A missing vault fails a read with recovery guidance. A locked vault, or a missing one when a command stores a secret, is unlocked or created with a prompt only when a controlling terminal exists: on the macOS terminal, or in a Linux desktop window with a 60 second timeout. Without a terminal the command fails at once, unless a Linux vault opens without a window. A cancelled or unanswered prompt fails and is not asked again in the same process.</desc>
  <style>
    :root { color-scheme: light dark; }
    .background { fill: #ffffff; }
    .node { fill: #f8fafc; stroke: #64748b; stroke-width: 2; }
    .core { fill: #eef2ff; stroke: #4f46e5; stroke-width: 2; }
    .action { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; }
    .decision { fill: #fefce8; stroke: #ca8a04; stroke-width: 2; }
    .ok { fill: #f0fdf4; stroke: #16a34a; stroke-width: 2; }
    .warn { fill: #fff7ed; stroke: #ea580c; stroke-width: 2; }
    .error { fill: #fef2f2; stroke: #dc2626; stroke-width: 2; }
    .activation { fill: #e0e7ff; stroke: #4f46e5; stroke-width: 1.5; }
    .boundary { fill: none; stroke: #16a34a; stroke-width: 1.5; stroke-dasharray: 8 6; }
    .line { fill: none; stroke: #475569; stroke-width: 2; marker-end: url(#arrow); }
    .connector { fill: none; stroke: #475569; stroke-width: 2; }
    .return { fill: none; stroke: #64748b; stroke-width: 1.5; stroke-dasharray: 6 5; marker-end: url(#arrow); }
    .lifeline { stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 7 7; }
    .title { fill: #0f172a; font: 700 24px system-ui, sans-serif; }
    .section { fill: #475569; font: 600 13px system-ui, sans-serif; text-anchor: middle; letter-spacing: .08em; }
    .label { fill: #0f172a; font: 600 16px system-ui, sans-serif; text-anchor: middle; }
    .detail { fill: #475569; font: 14px system-ui, sans-serif; text-anchor: middle; }
    .edge { fill: #475569; font: 600 13px system-ui, sans-serif; text-anchor: middle; }
    .boundary-label { fill: #15803d; font: 600 13px system-ui, sans-serif; }
    @media (prefers-color-scheme: dark) {
      .background { fill: #0f172a; }
      .node { fill: #1e293b; stroke: #94a3b8; }
      .core { fill: #312e81; stroke: #818cf8; }
      .action { fill: #172554; stroke: #60a5fa; }
      .decision { fill: #422006; stroke: #facc15; }
      .ok { fill: #052e16; stroke: #4ade80; }
      .warn { fill: #431407; stroke: #fb923c; }
      .error { fill: #450a0a; stroke: #f87171; }
      .activation { fill: #312e81; stroke: #818cf8; }
      .boundary { stroke: #4ade80; }
      .line, .connector, .return { stroke: #cbd5e1; }
      .lifeline { stroke: #64748b; }
      .title, .label { fill: #f8fafc; }
      .section, .detail, .edge { fill: #cbd5e1; }
      .boundary-label { fill: #4ade80; }
    }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect class="background" width="1200" height="840"/>
  <text class="title" x="40" y="42">Opening the credential vault</text>

  <rect class="node" x="430" y="75" width="340" height="60" rx="10"/>
  <text class="label" x="600" y="99">A command needs a credential</text>
  <text class="detail" x="600" y="121">add · edit · remove · exec · ping · doctor</text>

  <path class="line" d="M600 135 V165"/>

  <rect class="action" x="430" y="165" width="340" height="60" rx="10"/>
  <text class="label" x="600" y="189">Read the vault state</text>
  <text class="detail" x="600" y="211">never prompts · never reads items</text>

  <path class="line" d="M600 225 V245"/>

  <polygon class="decision" points="600,245 720,300 600,355 480,300"/>
  <text class="label" x="600" y="305">Vault state?</text>

  <path class="line" d="M720 300 H880"/>
  <text class="edge" x="800" y="288">unlocked</text>

  <rect class="ok" x="880" y="265" width="250" height="70" rx="10"/>
  <text class="label" x="1005" y="294">Read or write items</text>
  <text class="detail" x="1005" y="316">values never in argv</text>

  <path class="line" d="M480 300 H360"/>
  <text class="edge" x="420" y="288">missing, reading</text>

  <rect class="error" x="40" y="265" width="320" height="70" rx="10"/>
  <text class="label" x="200" y="294">Fail with recovery guidance</text>
  <text class="detail" x="200" y="316">restore the vault or replace the secret</text>

  <path class="line" d="M600 355 V420"/>
  <text class="edge" x="720" y="392">locked, or missing when storing</text>

  <polygon class="decision" points="600,420 720,480 600,540 480,480"/>
  <text class="label" x="600" y="474">Controlling</text>
  <text class="label" x="600" y="496">terminal?</text>

  <path class="line" d="M720 480 H880"/>
  <text class="edge" x="800" y="468">no</text>

  <rect class="error" x="880" y="435" width="250" height="90" rx="10"/>
  <text class="label" x="1005" y="463">Fail at once</text>
  <text class="detail" x="1005" y="485">no prompt, no window</text>
  <text class="detail" x="1005" y="507">Linux: unless it opens without one</text>

  <path class="line" d="M600 540 V590"/>
  <text class="edge" x="620" y="570">yes</text>

  <rect class="action" x="400" y="590" width="400" height="100" rx="10"/>
  <text class="label" x="600" y="623">Create or unlock with a prompt</text>
  <text class="detail" x="600" y="645">macOS: on the terminal, three attempts</text>
  <text class="detail" x="600" y="667">Linux: desktop window, 60 s timeout</text>

  <path class="line" d="M800 640 H1160 V300 H1130"/>
  <text class="edge" x="840" y="628">entered</text>

  <path class="line" d="M600 690 V740"/>
  <text class="edge" x="700" y="720">cancelled or no answer</text>

  <rect class="error" x="430" y="740" width="340" height="70" rx="10"/>
  <text class="label" x="600" y="769">Fail</text>
  <text class="detail" x="600" y="791">not asked again in this process</text>
</svg>
