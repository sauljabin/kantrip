<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="870" viewBox="0 0 1200 870" role="img" aria-labelledby="title desc">
  <title id="title">Kantrip exec sequence</title>
  <desc id="desc">The user asks Kantrip to execute a client with a profile. Kantrip reads metadata and secrets, creates a locked runtime session, renders native configuration, supervises the client, then removes the session and returns the client status.</desc>
  <style>
    :root { color-scheme: light dark; }
    .background { fill: #ffffff; }
    .node { fill: #f8fafc; stroke: #64748b; stroke-width: 2; }
    .core { fill: #eef2ff; stroke: #4f46e5; stroke-width: 2; }
    .action { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; }
    .decision { fill: #fefce8; stroke: #ca8a04; stroke-width: 2; }
    .ok { fill: #f0fdf4; stroke: #16a34a; stroke-width: 2; }
    .warn { fill: #fff7ed; stroke: #ea580c; stroke-width: 2; }
    .error { fill: #fef2f2; stroke: #dc2626; stroke-width: 2; }
    .activation { fill: #e0e7ff; stroke: #4f46e5; stroke-width: 1.5; }
    .boundary { fill: none; stroke: #16a34a; stroke-width: 1.5; stroke-dasharray: 8 6; }
    .line { fill: none; stroke: #475569; stroke-width: 2; marker-end: url(#arrow); }
    .connector { fill: none; stroke: #475569; stroke-width: 2; }
    .return { fill: none; stroke: #64748b; stroke-width: 1.5; stroke-dasharray: 6 5; marker-end: url(#arrow); }
    .lifeline { stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 7 7; }
    .title { fill: #0f172a; font: 700 24px system-ui, sans-serif; }
    .section { fill: #475569; font: 600 13px system-ui, sans-serif; text-anchor: middle; letter-spacing: .08em; }
    .label { fill: #0f172a; font: 600 16px system-ui, sans-serif; text-anchor: middle; }
    .detail { fill: #475569; font: 14px system-ui, sans-serif; text-anchor: middle; }
    .edge { fill: #475569; font: 600 13px system-ui, sans-serif; text-anchor: middle; }
    .boundary-label { fill: #15803d; font: 600 13px system-ui, sans-serif; }
    @media (prefers-color-scheme: dark) {
      .background { fill: #0f172a; }
      .node { fill: #1e293b; stroke: #94a3b8; }
      .core { fill: #312e81; stroke: #818cf8; }
      .action { fill: #172554; stroke: #60a5fa; }
      .decision { fill: #422006; stroke: #facc15; }
      .ok { fill: #052e16; stroke: #4ade80; }
      .warn { fill: #431407; stroke: #fb923c; }
      .error { fill: #450a0a; stroke: #f87171; }
      .activation { fill: #312e81; stroke: #818cf8; }
      .boundary { stroke: #4ade80; }
      .line, .connector, .return { stroke: #cbd5e1; }
      .lifeline { stroke: #64748b; }
      .title, .label { fill: #f8fafc; }
      .section, .detail, .edge { fill: #cbd5e1; }
      .boundary-label { fill: #4ade80; }
    }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect class="background" width="1200" height="870"/>
  <text class="title" x="40" y="42">One kantrip exec, step by step</text>
  <g transform="translate(0 50)">

  <rect class="node" x="30" y="32" width="140" height="58" rx="10"/>
  <text class="label" x="100" y="67">User</text>
  <rect class="core" x="215" y="32" width="150" height="58" rx="10"/>
  <text class="label" x="290" y="67">Kantrip</text>
  <rect class="node" x="405" y="32" width="160" height="58" rx="10"/>
  <text class="label" x="485" y="67">Profile store</text>
  <rect class="node" x="605" y="32" width="170" height="58" rx="10"/>
  <text class="label" x="690" y="67">Credential vault</text>
  <rect class="ok" x="815" y="32" width="150" height="58" rx="10"/>
  <text class="label" x="890" y="67">Runtime</text>
  <rect class="node" x="1010" y="32" width="160" height="58" rx="10"/>
  <text class="label" x="1090" y="67">Selected client</text>

  <line class="lifeline" x1="100" y1="90" x2="100" y2="780"/>
  <line class="lifeline" x1="290" y1="90" x2="290" y2="780"/>
  <line class="lifeline" x1="485" y1="90" x2="485" y2="780"/>
  <line class="lifeline" x1="690" y1="90" x2="690" y2="780"/>
  <line class="lifeline" x1="890" y1="90" x2="890" y2="780"/>
  <line class="lifeline" x1="1090" y1="90" x2="1090" y2="780"/>
  <rect class="activation" x="282" y="128" width="16" height="610" rx="4"/>

  <path class="line" d="M100 140 H282"/>
  <text class="detail" x="191" y="130">1 · exec(profile, command)</text>

  <path class="line" d="M298 205 H485"/>
  <text class="detail" x="392" y="195">2 · read and validate profile</text>
  <path class="return" d="M485 245 H298"/>
  <text class="edge" x="392" y="236">metadata + references</text>

  <path class="line" d="M298 305 H690"/>
  <text class="detail" x="494" y="295">3 · resolve referenced secrets</text>
  <path class="return" d="M690 345 H298"/>
  <text class="edge" x="494" y="336">secret values in memory</text>

  <rect class="boundary" x="795" y="382" width="190" height="250" rx="14"/>
  <text class="boundary-label" x="810" y="405">PRIVATE SESSION</text>
  <path class="line" d="M298 430 H890"/>
  <text class="detail" x="594" y="420">4 · create directory + hold flock</text>
  <path class="line" d="M298 490 H890"/>
  <text class="detail" x="594" y="480">5 · render native configuration</text>

  <path class="line" d="M298 560 H1090"/>
  <text class="detail" x="694" y="550">6 · start inside process or PTY boundary</text>
  <path class="line" d="M1090 590 h55 v34 h-55"/>
  <text class="edge" x="1145" y="642">client owns</text>
  <text class="edge" x="1145" y="657">the protocol</text>

  <path class="return" d="M1090 660 H298"/>
  <text class="detail" x="694" y="651">7 · exit status</text>
  <path class="line" d="M298 705 H890"/>
  <text class="detail" x="594" y="695">8 · remove session + release lock</text>
  <path class="return" d="M282 755 H100"/>
  <text class="detail" x="191" y="746">9 · return client status</text>
  </g>
</svg>
