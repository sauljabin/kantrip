<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="760" viewBox="0 0 1100 760" role="img" aria-labelledby="title desc">
  <title id="title">Kantrip session cleanup decision</title>
  <desc id="desc">A decision tree showing that only valid, unlocked sessions at least five minutes old are eligible for removal.</desc>
  <style>
    :root { color-scheme: light dark; }
    .background { fill: #ffffff; }
    .check { fill: #f8fafc; stroke: #64748b; stroke-width: 2; }
    .decision { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; }
    .safe { fill: #f0fdf4; stroke: #16a34a; stroke-width: 2; }
    .warning { fill: #fff7ed; stroke: #ea580c; stroke-width: 2; }
    .error { fill: #fef2f2; stroke: #dc2626; stroke-width: 2; }
    .line { fill: none; stroke: #475569; stroke-width: 2; marker-end: url(#arrow); }
    .label { fill: #0f172a; font: 600 16px system-ui, sans-serif; text-anchor: middle; }
    .detail { fill: #475569; font: 14px system-ui, sans-serif; text-anchor: middle; }
    .edge { fill: #475569; font: 600 13px system-ui, sans-serif; text-anchor: middle; }
    .heading { fill: #0f172a; font: 700 24px system-ui, sans-serif; }
    @media (prefers-color-scheme: dark) {
      .background { fill: #0f172a; }
      .check { fill: #1e293b; stroke: #94a3b8; }
      .decision { fill: #172554; stroke: #60a5fa; }
      .safe { fill: #052e16; stroke: #4ade80; }
      .warning { fill: #431407; stroke: #fb923c; }
      .error { fill: #450a0a; stroke: #f87171; }
      .line { stroke: #cbd5e1; }
      .label, .heading { fill: #f8fafc; }
      .detail, .edge { fill: #cbd5e1; }
    }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect class="background" width="1100" height="760"/>
  <text class="heading" x="40" y="42">Cleanup decision for one runtime entry</text>

  <rect class="check" x="360" y="70" width="380" height="70" rx="10"/>
  <text class="label" x="550" y="98">Validate runtime entry</text>
  <text class="detail" x="550" y="121">direct child · exact name · owner · mode · no symlink</text>

  <polygon class="decision" points="550,175 700,240 550,305 400,240"/>
  <text class="label" x="550" y="233">Safe directory, marker,</text>
  <text class="label" x="550" y="255">lock and contents?</text>
  <path class="line" d="M550 140 V175"/>

  <rect class="error" x="40" y="205" width="250" height="70" rx="10"/>
  <text class="label" x="165" y="234">Invalid</text>
  <text class="detail" x="165" y="257">report error · never delete</text>
  <path class="line" d="M400 240 H290"/>
  <text class="edge" x="345" y="228">no</text>

  <polygon class="decision" points="550,340 690,400 550,460 410,400"/>
  <text class="label" x="550" y="394">Can Kantrip acquire</text>
  <text class="label" x="550" y="416">the exclusive flock?</text>
  <path class="line" d="M550 305 V340"/>
  <text class="edge" x="568" y="327">yes</text>

  <rect class="safe" x="800" y="365" width="250" height="70" rx="10"/>
  <text class="label" x="925" y="394">Active</text>
  <text class="detail" x="925" y="417">valid state · never delete</text>
  <path class="line" d="M690 400 H800"/>
  <text class="edge" x="745" y="388">no</text>

  <polygon class="decision" points="550,495 690,555 550,615 410,555"/>
  <text class="label" x="550" y="549">At least five</text>
  <text class="label" x="550" y="571">minutes old?</text>
  <path class="line" d="M550 460 V495"/>
  <text class="edge" x="568" y="482">yes</text>

  <rect class="warning" x="800" y="520" width="250" height="70" rx="10"/>
  <text class="label" x="925" y="549">Recent</text>
  <text class="detail" x="925" y="572">warning · do not delete yet</text>
  <path class="line" d="M690 555 H800"/>
  <text class="edge" x="745" y="543">no</text>

  <polygon class="decision" points="550,640 665,690 550,740 435,690"/>
  <text class="label" x="550" y="685">Removal</text>
  <text class="label" x="550" y="706">enabled?</text>
  <path class="line" d="M550 615 V640"/>
  <text class="edge" x="568" y="630">yes</text>

  <rect class="warning" x="110" y="655" width="250" height="70" rx="10"/>
  <text class="label" x="235" y="684">Stale</text>
  <text class="detail" x="235" y="707">dry-run or doctor: report only</text>
  <path class="line" d="M435 690 H360"/>
  <text class="edge" x="398" y="678">no</text>

  <rect class="safe" x="740" y="655" width="250" height="70" rx="10"/>
  <text class="label" x="865" y="684">Removed</text>
  <text class="detail" x="865" y="707">descriptor-relative deletion</text>
  <path class="line" d="M665 690 H740"/>
  <text class="edge" x="703" y="678">yes</text>
</svg>
