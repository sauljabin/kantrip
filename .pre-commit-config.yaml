fail_fast: true
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-json
      - id: check-yaml
      - id: trailing-whitespace
      - id: check-added-large-files
        args: ["--maxkb=1024"]
  - repo: local
    hooks:
      - id: styles
        name: applying styles
        language: system
        always_run: true
        pass_filenames: false
        entry: uv run --locked python -m scripts.styles
      - id: banner
        name: generating banner
        language: system
        pass_filenames: false
        files: ^(kantrip/console\.py|scripts/(banner|__init__)\.py|pyproject\.toml|uv\.lock)$
        entry: uv run --locked python -m scripts.banner
      - id: analyze
        name: code analysis
        language: system
        always_run: true
        pass_filenames: false
        entry: uv run --locked python -m scripts.analyze
      - id: tests
        name: running tests
        language: system
        always_run: true
        pass_filenames: false
        entry: uv run --locked python -m scripts.tests
      - id: sandbox-smoke
        name: smoke testing sandbox adapters
        language: system
        always_run: true
        pass_filenames: false
        entry: >-
          uv run --locked python -m sandbox
          --shell bash --shell zsh --shell fish
