name: Set up Python and locked dependencies
description: Install a pinned uv and Python, then sync the locked project environment
inputs:
  python-version:
    description: Python version for the job
    required: true
  uv-version:
    description: Pinned uv version
    required: true
  enable-cache:
    description: Enable uv dependency caching
    required: false
    default: "true"
runs:
  using: composite
  steps:
    - name: Set up uv and Python
      uses: astral-sh/setup-uv@v10.1.0
      with:
        version: ${{ inputs.uv-version }}
        python-version: ${{ inputs.python-version }}
        enable-cache: ${{ inputs.enable-cache }}
        cache-dependency-glob: |
          pyproject.toml
          uv.lock
          .github/actions/python-uv/action.yml
        cache-suffix: ${{ inputs.uv-version }}-${{ hashFiles('.github/actions/python-uv/action.yml') }}
    - name: Sync locked dependencies
      shell: bash
      run: uv sync --locked
