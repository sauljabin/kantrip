name: E2E acceptance

on:
  workflow_call:
    inputs:
      candidate-artifact:
        description: Existing distribution bundle from this workflow run
        required: false
        type: string
        default: ""
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_VERSION: "0.12.10"

jobs:
  run-e2e:
    name: E2E / Ubuntu / released clients
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install operating-system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential dbus-x11 fish gnome-keyring kafkacat libcurl4-openssl-dev liblz4-dev \
            libsasl2-dev libssl-dev libzstd-dev openjdk-21-jre-headless zsh
      - name: Set up Python and locked dependencies
        uses: ./.github/actions/python-uv
        with:
          uv-version: ${{ env.UV_VERSION }}
          python-version: "3.13"
      - name: Set up Kind
        uses: helm/kind-action@v1.15.0
        with:
          install_only: true
          version: v0.31.0
          kubectl_version: v1.35.0
      - name: Set up kubectl
        uses: azure/setup-kubectl@v5.1.0
        with:
          version: v1.35.0
      - name: Set up Helm
        uses: azure/setup-helm@v5.0.1
        with:
          version: v4.1.1
      - name: Validate E2E Zsh startup
        run: uv run --locked python -m tests.e2e.shell_environment
      - name: Install verified released E2E clients
        uses: ./.github/actions/released-e2e-tools
        with:
          python-version: "3.13"
          uv-version: ${{ env.UV_VERSION }}
      - name: Build or select and install candidate wheel
        uses: ./.github/actions/candidate-wheel
        with:
          candidate-artifact: ${{ inputs.candidate-artifact }}
          python-version: "3.13"
      - name: Pre-create the disposable Kantrip vault
        uses: ./.github/actions/linux-vault
      - name: Run sandbox E2E with the Kantrip vault
        env:
          CI: "1"
          E2E_SCRIPT: |
            eval "$(printf "%s" "kantrip-ci-keyring" | gnome-keyring-daemon --unlock --components=secrets)"
            uv run --locked python -m sandbox up
            uv run --locked python -m scripts.tests --suite e2e
          KANTRIP_REQUIRED_SHELLS: bash,zsh,fish
          NO_COLOR: "1"
        run: dbus-run-session -- bash -euo pipefail -c "$E2E_SCRIPT"
      - name: Collect sanitized E2E diagnostics
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/e2e-diagnostics"
          kubectl --context kind-kantrip-sandbox get pods,services,deployments,jobs \
            --all-namespaces -o wide > "$RUNNER_TEMP/e2e-diagnostics/resources.txt" 2>&1 || true
          kubectl --context kind-kantrip-sandbox -n kantrip-sandbox get events \
            --sort-by=.lastTimestamp > "$RUNNER_TEMP/e2e-diagnostics/events.txt" 2>&1 || true
          docker stats --no-stream > "$RUNNER_TEMP/e2e-diagnostics/docker-stats.txt" 2>&1 || true
          docker system df > "$RUNNER_TEMP/e2e-diagnostics/docker-disk.txt" 2>&1 || true
      - name: Upload E2E diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: e2e-diagnostics
          path: ${{ runner.temp }}/e2e-diagnostics
          if-no-files-found: error
          retention-days: 7
      - name: Remove CI-owned sandbox
        if: always()
        run: uv run --locked python -m sandbox down

  vault-linux:
    name: E2E / Ubuntu / Kantrip vault
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install GNOME Keyring
        run: |
          sudo apt-get update
          sudo apt-get install --yes dbus gnome-keyring
      - name: Set up Python and locked dependencies
        uses: ./.github/actions/python-uv
        with:
          uv-version: ${{ env.UV_VERSION }}
          python-version: "3.13"
      - name: Build or select and install candidate wheel
        uses: ./.github/actions/candidate-wheel
        with:
          candidate-artifact: ${{ inputs.candidate-artifact }}
          python-version: "3.13"
      - name: Pre-create the disposable Kantrip vault
        uses: ./.github/actions/linux-vault
      - name: Run the vault acceptance suite
        env:
          CI: "1"
          NO_COLOR: "1"
          VAULT_SCRIPT: |
            eval "$(printf "%s" "kantrip-ci-keyring" | gnome-keyring-daemon --unlock --components=secrets)"
            uv run --locked python -m scripts.tests --suite vault
        run: dbus-run-session -- bash -euo pipefail -c "$VAULT_SCRIPT"

  vault-macos:
    name: E2E / macOS / Kantrip vault
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python and locked dependencies
        uses: ./.github/actions/python-uv
        with:
          uv-version: ${{ env.UV_VERSION }}
          python-version: "3.13"
      - name: Build or select and install candidate wheel
        uses: ./.github/actions/candidate-wheel
        with:
          candidate-artifact: ${{ inputs.candidate-artifact }}
          python-version: "3.13"
      - name: Create the disposable Kantrip vault
        run: |
          set -euo pipefail
          # A runner has no terminal to prompt on, so this throwaway vault gets a
          # random password on the command line; the suite locks and unlocks it.
          password="$(openssl rand -hex 24)"
          echo "::add-mask::$password"
          echo "KANTRIP_E2E_VAULT_PASSWORD=$password" >> "$GITHUB_ENV"
          vault="$HOME/Library/Keychains/kantrip.keychain-db"
          security create-keychain -p "$password" "$vault" < /dev/null
          security set-keychain-settings -l -u -t 3600 "$vault"
      - name: Run the vault acceptance suite
        env:
          CI: "1"
          NO_COLOR: "1"
        run: uv run --locked python -m scripts.tests --suite vault
      - name: Remove the disposable Kantrip vault
        if: always()
        run: security delete-keychain "$HOME/Library/Keychains/kantrip.keychain-db" || true
