name: E2E acceptance

on:
  workflow_call:
    inputs:
      candidate-artifact:
        description: Existing distribution bundle from this workflow run
        required: false
        type: string
        default: ""
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_VERSION: "0.12.10"

jobs:
  run-e2e:
    name: E2E / Ubuntu / released clients
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install operating-system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential dbus-x11 fish gnome-keyring kafkacat libcurl4-openssl-dev liblz4-dev \
            libsasl2-dev libsecret-1-0 libssl-dev libzstd-dev openjdk-21-jre-headless zsh
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.13"
          enable-cache: true
      - name: Set up Kind
        uses: helm/kind-action@v1.14.0
        with:
          install_only: true
          version: v0.31.0
          kubectl_version: v1.35.0
      - name: Set up kubectl
        uses: azure/setup-kubectl@v5.1.0
        with:
          version: v1.35.0
      - name: Set up Helm
        uses: azure/setup-helm@v5.0.1
        with:
          version: v4.1.1
      - name: Sync dependencies
        run: uv sync --locked
      - name: Download exact release distribution bundle
        if: inputs.candidate-artifact != ''
        uses: actions/download-artifact@v8.0.1
        with:
          name: ${{ inputs.candidate-artifact }}
      - name: Validate E2E Zsh startup
        run: uv run --locked python -m tests.e2e.shell_environment
      - name: Restore verified released clients
        id: released-clients
        uses: actions/cache/restore@v6.1.0
        with:
          path: ${{ runner.temp }}/kantrip-e2e-tools
          key: released-clients-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tests/e2e/versions.env', '.github/workflows/e2e.yml') }}
      - name: Install pinned released client tools
        if: steps.released-clients.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          source tests/e2e/versions.env
          tool_root="$RUNNER_TEMP/kantrip-e2e-tools"
          mkdir -p "$tool_root/bin"
          curl --fail --location --retry 3 \
            "https://github.com/confluentinc/librdkafka/archive/refs/tags/v${LIBRDKAFKA_MIN_VERSION}.tar.gz" \
            -o "$RUNNER_TEMP/librdkafka-v${LIBRDKAFKA_MIN_VERSION}.tar.gz"
          printf '%s  %s\n' "$LIBRDKAFKA_SOURCE_SHA256" \
            "librdkafka-v${LIBRDKAFKA_MIN_VERSION}.tar.gz" \
            | (cd "$RUNNER_TEMP" && sha256sum --check -)
          tar -xzf "$RUNNER_TEMP/librdkafka-v${LIBRDKAFKA_MIN_VERSION}.tar.gz" -C "$tool_root"
          (
            cd "$tool_root/librdkafka-${LIBRDKAFKA_MIN_VERSION}"
            ./configure --prefix="$tool_root/librdkafka"
            make -j2 libs
            make install
          )
          export LD_LIBRARY_PATH="$tool_root/librdkafka/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          kcat -V
          kcat -X list | grep -E '^https[.]ca[.]location[[:space:]]+[|]' > /dev/null
          curl --fail --location --retry 3 \
            "https://archive.apache.org/dist/kafka/${APACHE_KAFKA_VERSION}/kafka_2.13-${APACHE_KAFKA_VERSION}.tgz" \
            -o "$RUNNER_TEMP/kafka_2.13-${APACHE_KAFKA_VERSION}.tgz"
          curl --fail --location --retry 3 \
            "https://archive.apache.org/dist/kafka/${APACHE_KAFKA_VERSION}/kafka_2.13-${APACHE_KAFKA_VERSION}.tgz.sha512" \
            -o "$RUNNER_TEMP/kafka_2.13-${APACHE_KAFKA_VERSION}.tgz.sha512"
          apache_checksum="$(sed 's/^[^:]*: //' "$RUNNER_TEMP/kafka_2.13-${APACHE_KAFKA_VERSION}.tgz.sha512" \
            | tr -d '[:space:]')"
          printf '%s  %s\n' "$apache_checksum" "kafka_2.13-${APACHE_KAFKA_VERSION}.tgz" \
            | (cd "$RUNNER_TEMP" && sha512sum --check -)
          tar -xzf "$RUNNER_TEMP/kafka_2.13-${APACHE_KAFKA_VERSION}.tgz" -C "$tool_root"
          curl --fail --location --retry 3 \
            "https://packages.confluent.io/archive/8.3/confluent-${CONFLUENT_VERSION}.tar.gz" \
            -o "$RUNNER_TEMP/confluent-${CONFLUENT_VERSION}.tar.gz"
          curl --fail --location --retry 3 \
            "https://packages.confluent.io/archive/8.3/confluent-${CONFLUENT_VERSION}.tar.gz.sha256.txt" \
            -o "$RUNNER_TEMP/confluent-${CONFLUENT_VERSION}.tar.gz.sha256.txt"
          (cd "$RUNNER_TEMP" && sha256sum --check "confluent-${CONFLUENT_VERSION}.tar.gz.sha256.txt")
          tar -xzf "$RUNNER_TEMP/confluent-${CONFLUENT_VERSION}.tar.gz" -C "$tool_root"
          ln -s "$(command -v kcat)" "$tool_root/bin/kafkacat"
          UV_TOOL_DIR="$tool_root/uv" UV_TOOL_BIN_DIR="$tool_root/bin" \
            uv tool install --python 3.13 "kaskade==${KASKADE_VERSION}"
      - name: Activate and verify released clients
        run: |
          set -euo pipefail
          source tests/e2e/versions.env
          tool_root="$RUNNER_TEMP/kantrip-e2e-tools"
          test -x "$tool_root/bin/kaskade"
          test -x "$tool_root/confluent-${CONFLUENT_VERSION}/bin/kafka-avro-console-consumer"
          test -x "$tool_root/kafka_2.13-${APACHE_KAFKA_VERSION}/bin/kafka-console-consumer.sh"
          test -f "$tool_root/librdkafka/lib/librdkafka.so"
          "$tool_root/bin/kaskade" --version | grep -F "$KASKADE_VERSION"
          "$tool_root/confluent-${CONFLUENT_VERSION}/bin/kafka-topics" --version \
            | grep -F "$CONFLUENT_VERSION"
          "$tool_root/kafka_2.13-${APACHE_KAFKA_VERSION}/bin/kafka-topics.sh" --version \
            | grep -F "$APACHE_KAFKA_VERSION"
          LD_LIBRARY_PATH="$tool_root/librdkafka/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" \
            kcat -V | grep -F "$KCAT_VERSION" | grep -F "$LIBRDKAFKA_MIN_VERSION"
          LD_LIBRARY_PATH="$tool_root/librdkafka/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" \
            kcat -X list | grep -E '^https[.]ca[.]location[[:space:]]+[|]' > /dev/null
          echo "LD_LIBRARY_PATH=$tool_root/librdkafka/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
          {
            echo "$tool_root/bin"
            echo "$tool_root/confluent-${CONFLUENT_VERSION}/bin"
            echo "$tool_root/kafka_2.13-${APACHE_KAFKA_VERSION}/bin"
          } >> "$GITHUB_PATH"
      - name: Save verified released clients
        if: steps.released-clients.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: ${{ runner.temp }}/kantrip-e2e-tools
          key: released-clients-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tests/e2e/versions.env', '.github/workflows/e2e.yml') }}
      - name: Build or select and install candidate wheel
        env:
          CANDIDATE_ARTIFACT_NAME: ${{ inputs.candidate-artifact }}
        run: |
          set -euo pipefail
          candidate_root="$RUNNER_TEMP/kantrip-candidate"
          if [[ -n "$CANDIDATE_ARTIFACT_NAME" ]]; then
            shopt -s nullglob
            wheels=(dist/*.whl)
            test "${#wheels[@]}" -eq 1
          else
            uv build --wheel --out-dir "$candidate_root/dist"
            wheels=("$candidate_root"/dist/*.whl)
          fi
          uv venv --python 3.13 "$candidate_root/venv"
          uv pip install --python "$candidate_root/venv/bin/python" "${wheels[0]}"
          echo "KANTRIP_E2E_KANTRIP=$candidate_root/venv/bin/kantrip" >> "$GITHUB_ENV"
      - name: Run sandbox E2E with native Secret Service
        env:
          CI: "1"
          E2E_SCRIPT: |
            eval "$(printf "%s" "kantrip-ci-keyring" | gnome-keyring-daemon --unlock --components=secrets)"
            uv run --locked python -m sandbox up
            uv run --locked python -m scripts.tests --suite e2e
          KANTRIP_REQUIRED_SHELLS: bash,zsh,fish
          NO_COLOR: "1"
          PYTHON_KEYRING_BACKEND: keyring.backends.SecretService.Keyring
        run: dbus-run-session -- bash -euo pipefail -c "$E2E_SCRIPT"
      - name: Collect sanitized E2E diagnostics
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/e2e-diagnostics"
          kubectl --context kind-kantrip-sandbox get pods,services,deployments,jobs \
            --all-namespaces -o wide > "$RUNNER_TEMP/e2e-diagnostics/resources.txt" 2>&1 || true
          kubectl --context kind-kantrip-sandbox -n kantrip-sandbox get events \
            --sort-by=.lastTimestamp > "$RUNNER_TEMP/e2e-diagnostics/events.txt" 2>&1 || true
          docker stats --no-stream > "$RUNNER_TEMP/e2e-diagnostics/docker-stats.txt" 2>&1 || true
          docker system df > "$RUNNER_TEMP/e2e-diagnostics/docker-disk.txt" 2>&1 || true
      - name: Upload E2E diagnostics
        if: always()
        uses: actions/upload-artifact@v6.0.0
        with:
          name: e2e-diagnostics
          path: ${{ runner.temp }}/e2e-diagnostics
          if-no-files-found: error
          retention-days: 7
      - name: Remove CI-owned sandbox
        if: always()
        run: uv run --locked python -m sandbox down
