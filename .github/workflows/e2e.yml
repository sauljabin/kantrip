name: E2E acceptance

on:
  workflow_call:
    inputs:
      candidate-artifact:
        description: Existing distribution bundle from this workflow run
        required: false
        type: string
        default: ""
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_VERSION: "0.12.10"

jobs:
  run-e2e:
    name: E2E / Ubuntu / released clients
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install operating-system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential dbus-x11 fish gnome-keyring kafkacat libcurl4-openssl-dev liblz4-dev \
            libsasl2-dev libsecret-1-0 libssl-dev libzstd-dev openjdk-21-jre-headless zsh
      - name: Set up Python and locked dependencies
        uses: ./.github/actions/python-uv
        with:
          uv-version: ${{ env.UV_VERSION }}
          python-version: "3.13"
      - name: Set up Kind
        uses: helm/kind-action@v1.15.0
        with:
          install_only: true
          version: v0.31.0
          kubectl_version: v1.35.0
      - name: Set up kubectl
        uses: azure/setup-kubectl@v5.1.0
        with:
          version: v1.35.0
      - name: Set up Helm
        uses: azure/setup-helm@v5.0.1
        with:
          version: v4.1.1
      - name: Download exact release distribution bundle
        if: inputs.candidate-artifact != ''
        uses: actions/download-artifact@v8.0.1
        with:
          name: ${{ inputs.candidate-artifact }}
      - name: Validate E2E Zsh startup
        run: uv run --locked python -m tests.e2e.shell_environment
      - name: Install verified released E2E clients
        uses: ./.github/actions/released-e2e-tools
        with:
          python-version: "3.13"
          uv-version: ${{ env.UV_VERSION }}
      - name: Build or select and install candidate wheel
        env:
          CANDIDATE_ARTIFACT_NAME: ${{ inputs.candidate-artifact }}
        run: |
          set -euo pipefail
          candidate_root="$RUNNER_TEMP/kantrip-candidate"
          if [[ -n "$CANDIDATE_ARTIFACT_NAME" ]]; then
            shopt -s nullglob
            wheels=(dist/*.whl)
            test "${#wheels[@]}" -eq 1
          else
            uv build --wheel --out-dir "$candidate_root/dist"
            wheels=("$candidate_root"/dist/*.whl)
          fi
          uv venv --python 3.13 "$candidate_root/venv"
          uv pip install --python "$candidate_root/venv/bin/python" "${wheels[0]}"
          echo "KANTRIP_E2E_KANTRIP=$candidate_root/venv/bin/kantrip" >> "$GITHUB_ENV"
      - name: Run sandbox E2E with native Secret Service
        env:
          CI: "1"
          E2E_SCRIPT: |
            eval "$(printf "%s" "kantrip-ci-keyring" | gnome-keyring-daemon --unlock --components=secrets)"
            uv run --locked python -m sandbox up
            uv run --locked python -m scripts.tests --suite e2e
          KANTRIP_REQUIRED_SHELLS: bash,zsh,fish
          NO_COLOR: "1"
          PYTHON_KEYRING_BACKEND: keyring.backends.SecretService.Keyring
        run: dbus-run-session -- bash -euo pipefail -c "$E2E_SCRIPT"
      - name: Collect sanitized E2E diagnostics
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/e2e-diagnostics"
          kubectl --context kind-kantrip-sandbox get pods,services,deployments,jobs \
            --all-namespaces -o wide > "$RUNNER_TEMP/e2e-diagnostics/resources.txt" 2>&1 || true
          kubectl --context kind-kantrip-sandbox -n kantrip-sandbox get events \
            --sort-by=.lastTimestamp > "$RUNNER_TEMP/e2e-diagnostics/events.txt" 2>&1 || true
          docker stats --no-stream > "$RUNNER_TEMP/e2e-diagnostics/docker-stats.txt" 2>&1 || true
          docker system df > "$RUNNER_TEMP/e2e-diagnostics/docker-disk.txt" 2>&1 || true
      - name: Upload E2E diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: e2e-diagnostics
          path: ${{ runner.temp }}/e2e-diagnostics
          if-no-files-found: error
          retention-days: 7
      - name: Remove CI-owned sandbox
        if: always()
        run: uv run --locked python -m sandbox down
