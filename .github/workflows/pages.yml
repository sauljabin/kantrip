name: Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Redeploy with the new version once the Release workflow publishes it. A
  # `release` trigger would not fire, because that workflow creates releases with
  # GITHUB_TOKEN, and would run on the tag, which github-pages refuses;
  # workflow_run runs on main.
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_VERSION: "0.12.10"

jobs:
  validate:
    name: Validate site
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python and locked dependencies
        uses: ./.github/actions/python-uv
        with:
          uv-version: ${{ env.UV_VERSION }}
          python-version: "3.14"
      - name: Write the current release into the page
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run --locked python -m scripts.website release
      # Also catches CLI changes outside site/ that break the demo commands.
      - name: Check links, assets, transcript, release, and demo commands
        run: uv run --locked python -m scripts.website check
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: [validate]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5.0.1
