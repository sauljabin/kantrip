name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.12.10"

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.14"
          enable-cache: true
      - name: Sync dependencies
        run: uv sync --locked
      - name: Analyze
        run: uv run --locked python -m scripts.analyze

  unit-tests:
    name: Unit / ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Sync dependencies
        run: uv sync --locked
      - name: Run unit tests
        run: uv run --locked python -m scripts.tests --suite unit

  e2e-tests:
    name: E2E / Ubuntu / released clients
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'run-e2e')
    uses: ./.github/workflows/e2e.yml

  build:
    name: Package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.10"
          enable-cache: true
      - name: Sync dependencies
        run: uv sync --locked
      - name: Verify lockfile
        run: uv lock --check
      - name: Build distributions
        run: uv build --clear
      - name: Verify distributions
        run: uv run --locked python -m scripts.verify_release dist

  result:
    name: CI result
    if: always()
    needs: [quality, unit-tests, e2e-tests, build]
    runs-on: ubuntu-latest
    steps:
      - name: Require successful jobs
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          UNIT_RESULT: ${{ needs.unit-tests.result }}
          E2E_RESULT: ${{ needs.e2e-tests.result }}
          E2E_REQUESTED: ${{ contains(github.event.pull_request.labels.*.name, 'run-e2e') }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          test "$QUALITY_RESULT" = success
          test "$UNIT_RESULT" = success
          if [[ "$GITHUB_EVENT_NAME" == pull_request && "$E2E_REQUESTED" != true ]]; then
            test "$E2E_RESULT" = skipped
          else
            test "$E2E_RESULT" = success
          fi
          test "$BUILD_RESULT" = success
