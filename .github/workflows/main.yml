name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.12.10"

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python and locked dependencies
        uses: ./.github/actions/python-uv
        with:
          uv-version: ${{ env.UV_VERSION }}
          python-version: "3.14"
      - name: Analyze
        run: uv run --locked python -m scripts.analyze

  unit-tests:
    name: Unit / ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python and locked dependencies
        uses: ./.github/actions/python-uv
        with:
          uv-version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: uv run --locked python -m scripts.tests --suite unit

  e2e-selection:
    name: E2E selection
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run_e2e: ${{ steps.decide.outputs.run_e2e }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select E2E
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action || '' }}
          EVENT_LABEL: ${{ github.event.label.name || '' }}
          BEFORE: ${{ github.event.before || '' }}
          AFTER: ${{ github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # A PR opened with a label may not carry it in the event payload; read
          # the current labels so the racing opened and labeled runs agree.
          pr_labels=""
          if [ "$EVENT_NAME" = pull_request ] && [ "$EVENT_ACTION" = opened ]; then
            pr_labels="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
              --json labels --jq '[.labels[].name] | join(",")')"
          fi
          selected="$(python3 scripts/tests.py --ci-event "$EVENT_NAME" \
            --action "$EVENT_ACTION" --label "$EVENT_LABEL" --pr-labels "$pr_labels" \
            --before "$BEFORE" --after "$AFTER")"
          echo "run_e2e=$selected" >> "$GITHUB_OUTPUT"
          echo "E2E selected: $selected"

  e2e-tests:
    name: E2E / Ubuntu / released clients
    needs: [e2e-selection]
    if: needs.e2e-selection.outputs.run_e2e == 'true'
    uses: ./.github/workflows/e2e.yml

  build:
    name: Package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python and locked dependencies
        uses: ./.github/actions/python-uv
        with:
          uv-version: ${{ env.UV_VERSION }}
          python-version: "3.10"
      - name: Verify lockfile
        run: uv lock --check
      - name: Build distributions
        run: uv build --clear
      - name: Verify distributions
        run: uv run --locked python -m scripts.verify_release dist

  result:
    name: CI result
    if: always()
    needs: [quality, unit-tests, e2e-selection, e2e-tests, build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Require successful jobs
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          UNIT_RESULT: ${{ needs.unit-tests.result }}
          SELECT_RESULT: ${{ needs.e2e-selection.result }}
          E2E_SELECTED: ${{ needs.e2e-selection.outputs.run_e2e }}
          E2E_RESULT: ${{ needs.e2e-tests.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          test "$QUALITY_RESULT" = success
          test "$UNIT_RESULT" = success
          test "$SELECT_RESULT" = success
          python3 scripts/tests.py --verify-e2e-result "$E2E_SELECTED" "$E2E_RESULT"
          test "$BUILD_RESULT" = success
