name: Bug report
description: Report a reproducible problem with Kantrip
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Search existing issues first, and remove passwords, tokens, certificates, profile contents, and private broker addresses from everything you paste.
  - type: dropdown
    id: client
    attributes:
      label: Client
      options:
        - kcat
        - Apache or Confluent Kafka commands
        - Kaskade
        - kaf
        - kcl
        - kafui
        - Not client-specific
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Kantrip version
      description: The output of `kantrip --version`.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened
      description: The command you ran, what you saw, and what you expected.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, shell, installation method, Python version, Kafka distribution, and authentication mechanism.
      placeholder: "macOS 15.6, Zsh, Homebrew, Python 3.15, Apache Kafka 4.3, SCRAM-SHA-512"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      render: shell
