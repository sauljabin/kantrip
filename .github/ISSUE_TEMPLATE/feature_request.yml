name: Feature request
description: Propose an improvement to Kantrip
title: "feat: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: Search existing issues and discussions first. Describe the problem so other solutions stay open.
  - type: dropdown
    id: client
    attributes:
      label: Client
      options:
        - kcat
        - Apache or Confluent Kafka commands
        - Kaskade
        - kaf
        - kcl
        - kafui
        - Not client-specific
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can't you do today, or what is hard?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: How Kantrip should behave, from a user's point of view.
    validations:
      required: true
