[project]
name = "kantrip"
dynamic = ["version"]
description = "Kantrip securely manages local Kafka profiles for command-line tools and compatible applications."
authors = [{ name = "Saúl Piña", email = "sauljabin@gmail.com" }]
license = "MIT"
readme = "README.md"
keywords = ["kafka", "configuration", "profiles", "cli", "kantrip"]
classifiers = [
    "Environment :: Console",
    "Operating System :: MacOS",
    "Operating System :: Unix",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
requires-python = ">=3.10,<3.15"
dependencies = [
    "click>=8.2,<9",
    "cloup>=3.1,<4",
    "confluent-kafka>=2.15,<3",
    "cryptography>=44,<51",
    "jsonschema>=4.25,<5",
    "keyring>=25.7,<26",
    "pyyaml>=6.0,<7",
    "rich>=14.2,<16",
]

[project.scripts]
kantrip = "kantrip.cli:cli"

[project.urls]
homepage = "https://github.com/sauljabin/kantrip"
repository = "https://github.com/sauljabin/kantrip"
documentation = "https://github.com/sauljabin/kantrip"
changelog = "https://github.com/sauljabin/kantrip/releases"
issues = "https://github.com/sauljabin/kantrip/issues"
funding = "https://github.com/sponsors/sauljabin"

[dependency-groups]
dev = [
    "actionlint-py",
    "black",
    "mypy",
    "pre-commit",
    "pyte>=0.8.2,<1",
    "ruff",
    "types-pyyaml",
    "typos",
]

[build-system]
requires = ["hatchling>=1.27,<2", "hatch-vcs>=0.5,<1"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
tag-pattern = "^v(?P<version>[0-9]+\\.[0-9]+\\.[0-9]+(?:(?:a|b|rc)[0-9]+)?)$"

[tool.hatch.version.raw-options]
local_scheme = "no-local-version"
fallback_version = "0.0.0"

[tool.hatch.build.targets.wheel]
packages = ["kantrip"]

[tool.hatch.build.targets.wheel.force-include]
"schemas" = "kantrip/schemas"

[tool.hatch.build.targets.sdist]
include = [
    "/AGENT.md",
    "/ARCHITECTURE.md",
    "/COMPATIBILITY.md",
    "/DEVELOPMENT.md",
    "/LICENSE",
    "/MANUAL_TESTING.md",
    "/MVP.md",
    "/README.md",
    "/RELEASE_CHECKLIST.md",
    "/SECURITY.md",
    "/THREAT_MODEL.md",
    "/USAGE.md",
    "/examples",
    "/images",
    "/kantrip",
    "/sandbox",
    "/schemas",
    "/scripts",
    "/tests",
]
exclude = ["/sandbox/.state"]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = ["C901"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.typos]
type.lock.extend-glob = ["*.lock"]
type.lock.check-file = true
files.extend-exclude = ["uv.lock", "images/banner.svg"]
