x-kafka-common: &kafka-common
  image: confluentinc/cp-kafka:${CONFLUENT_VERSION}
  restart: unless-stopped
  environment: &kafka-environment
    CLUSTER_ID: ${CLUSTER_ID}
    KAFKA_PROCESS_ROLES: broker,controller
    KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
    KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
    KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
    KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka1:9093
    KAFKA_DEFAULT_REPLICATION_FACTOR: "1"
    KAFKA_MIN_INSYNC_REPLICAS: "1"
    KAFKA_NUM_PARTITIONS: "10"
    KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
    KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
    KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
  healthcheck:
    test: [CMD-SHELL, "kafka-topics --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
    interval: 10s
    timeout: 10s
    retries: 10
    start_period: 20s

services:
  kafka1:
    <<: *kafka-common
    environment:
      <<: *kafka-environment
      KAFKA_NODE_ID: "1"
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka1:9092,EXTERNAL://localhost:9092
      KAFKA_LISTENERS: CONTROLLER://0.0.0.0:9093,INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:19092
    ports:
      - "9092:19092"

  schema-registry:
    image: confluentinc/cp-schema-registry:${CONFLUENT_VERSION}
    restart: unless-stopped
    depends_on:
      kafka1:
        condition: service_healthy
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka1:9092
    healthcheck:
      test: [CMD-SHELL, "curl --fail --silent http://localhost:8081/subjects >/dev/null"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    ports:
      - "8081:8081"

networks:
  default:
    name: kantrip-sandbox
