apiVersion: v1
kind: Namespace
metadata:
  name: kantrip-sandbox
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: kantrip-sandbox-selfsigned
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: sandbox-root-ca
  namespace: kantrip-sandbox
spec:
  isCA: true
  commonName: Kantrip Sandbox Root CA
  subject:
    organizations:
      - Kantrip Sandbox
  secretName: sandbox-root-ca
  duration: 8760h
  renewBefore: 720h
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: kantrip-sandbox-selfsigned
    kind: ClusterIssuer
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: sandbox-ca
  namespace: kantrip-sandbox
spec:
  ca:
    secretName: sandbox-root-ca
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: keycloak-tls
  namespace: kantrip-sandbox
spec:
  secretName: keycloak-tls
  duration: 720h
  renewBefore: 168h
  privateKey:
    algorithm: RSA
    encoding: PKCS8
    size: 2048
  usages:
    - server auth
  dnsNames:
    - localhost
    - keycloak
    - keycloak.kantrip-sandbox.svc
    - keycloak.kantrip-sandbox.svc.cluster.local
  ipAddresses:
    - 127.0.0.1
  issuerRef:
    name: sandbox-ca
    kind: Issuer
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: kafka-listeners-tls
  namespace: kantrip-sandbox
spec:
  secretName: kafka-listeners-tls
  duration: 720h
  renewBefore: 168h
  privateKey:
    algorithm: RSA
    encoding: PKCS8
    size: 2048
  usages:
    - server auth
  dnsNames:
    - localhost
  ipAddresses:
    - 127.0.0.1
  issuerRef:
    name: sandbox-ca
    kind: Issuer
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: registries-tls
  namespace: kantrip-sandbox
spec:
  secretName: registries-tls
  duration: 720h
  renewBefore: 168h
  privateKey:
    algorithm: RSA
    encoding: PKCS8
    size: 2048
  usages:
    - server auth
  dnsNames:
    - localhost
    - apicurio-secure
    - apicurio-secure.kantrip-sandbox.svc
    - schema-registry-secure
    - schema-registry-secure.kantrip-sandbox.svc
    - schema-registry-oauth
    - schema-registry-oauth.kantrip-sandbox.svc
  ipAddresses:
    - 127.0.0.1
  issuerRef:
    name: sandbox-ca
    kind: Issuer
