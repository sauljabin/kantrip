kind: Service
metadata:
  name: schema-registry-mtls
  namespace: kantrip-sandbox
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: schema-registry-mtls
  ports:
    - {name: https, port: 8081, targetPort: https, nodePort: 30086}
