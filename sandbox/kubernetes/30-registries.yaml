apiVersion: apps/v1
kind: Deployment
metadata:
  name: apicurio
  namespace: kantrip-sandbox
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: apicurio
  template:
    metadata:
      labels:
        app.kubernetes.io/name: apicurio
    spec:
      containers:
        - name: apicurio
          image: apicurio/apicurio-registry:${APICURIO_VERSION}
          env:
            - name: APICURIO_STORAGE_KIND
              value: kafkasql
            - name: APICURIO_KAFKASQL_BOOTSTRAP_SERVERS
              value: kantrip-kafka-bootstrap:9097
            - name: APICURIO_KAFKASQL_TOPIC
              value: apicurio-journal
            - name: APICURIO_KAFKASQL_SNAPSHOTS_TOPIC
              value: apicurio-snapshots
            - name: QUARKUS_HTTP_PORT
              value: "8080"
          ports:
            - name: http
              containerPort: 8080
            - name: management
              containerPort: 9000
          readinessProbe:
            httpGet:
              port: management
              path: /health/ready
            initialDelaySeconds: 15
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 768Mi
---
apiVersion: v1
kind: Service
metadata:
  name: apicurio
  namespace: kantrip-sandbox
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: apicurio
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30082
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: apicurio-secure
  namespace: kantrip-sandbox
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: apicurio-secure
  template:
    metadata:
      labels:
        app.kubernetes.io/name: apicurio-secure
    spec:
      initContainers:
        - name: build-oidc-truststore
          image: eclipse-temurin:21-jre
          command:
            - keytool
          args:
            - -importcert
            - -noprompt
            - -alias
            - sandbox-root
            - -file
            - /source/ca.crt
            - -keystore
            - /trust/ca.p12
            - -storetype
            - PKCS12
            - -storepass
            - changeit
          volumeMounts:
            - name: ca
              mountPath: /source
              readOnly: true
            - name: truststore
              mountPath: /trust
      containers:
        - name: apicurio
          image: apicurio/apicurio-registry:${APICURIO_VERSION}
          env:
            - name: APICURIO_STORAGE_KIND
              value: kafkasql
            - name: APICURIO_KAFKASQL_BOOTSTRAP_SERVERS
              value: kantrip-kafka-bootstrap:9097
            - name: APICURIO_KAFKASQL_TOPIC
              value: apicurio-secure-journal
            - name: APICURIO_KAFKASQL_SNAPSHOTS_TOPIC
              value: apicurio-secure-snapshots
            - name: QUARKUS_HTTP_INSECURE_REQUESTS
              value: disabled
            - name: QUARKUS_HTTP_SSL_PORT
              value: "8443"
            - name: QUARKUS_HTTP_SSL_CERTIFICATE_FILES
              value: /etc/registry-tls/tls.crt
            - name: QUARKUS_HTTP_SSL_CERTIFICATE_KEY_FILES
              value: /etc/registry-tls/tls.key
            - name: QUARKUS_OIDC_TENANT_ENABLED
              value: "true"
            - name: QUARKUS_OIDC_APPLICATION_TYPE
              value: service
            - name: QUARKUS_OIDC_AUTH_SERVER_URL
              value: https://keycloak:8443/realms/kantrip
            - name: QUARKUS_OIDC_CLIENT_ID
              value: registry-api
            - name: QUARKUS_OIDC_TOKEN_ISSUER
              value: https://localhost:8443/realms/kantrip
            - name: QUARKUS_OIDC_TLS_TRUST_STORE_FILE
              value: /etc/oidc-truststore/ca.p12
            - name: QUARKUS_OIDC_TLS_TRUST_STORE_PASSWORD
              value: changeit
            - name: JAVA_TOOL_OPTIONS
              value: >-
                -Djavax.net.ssl.trustStore=/etc/oidc-truststore/ca.p12
                -Djavax.net.ssl.trustStorePassword=changeit
            - name: APICURIO_AUTHN_BASIC_CLIENT_CREDENTIALS_ENABLED
              value: "true"
          ports:
            - name: https
              containerPort: 8443
            - name: management
              containerPort: 9000
          readinessProbe:
            httpGet:
              port: management
              path: /health/ready
            initialDelaySeconds: 15
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 768Mi
          volumeMounts:
            - name: tls
              mountPath: /etc/registry-tls
              readOnly: true
            - name: truststore
              mountPath: /etc/oidc-truststore
              readOnly: true
      volumes:
        - name: ca
          secret:
            secretName: sandbox-root-ca
            items:
              - key: ca.crt
                path: ca.crt
        - name: truststore
          emptyDir: {}
        - name: tls
          secret:
            secretName: registries-tls
---
apiVersion: v1
kind: Service
metadata:
  name: apicurio-secure
  namespace: kantrip-sandbox
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: apicurio-secure
  ports:
    - name: https
      port: 8443
      targetPort: https
      nodePort: 30084
