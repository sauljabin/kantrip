apiVersion: apps/v1
kind: Deployment
metadata:
  name: schema-registry
  namespace: kantrip-sandbox
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: schema-registry
  template:
    metadata:
      labels:
        app.kubernetes.io/name: schema-registry
    spec:
      enableServiceLinks: false
      containers:
        - name: schema-registry
          image: confluentinc/cp-schema-registry:${SCHEMA_REGISTRY_VERSION}
          env:
            - name: SCHEMA_REGISTRY_HOST_NAME
              value: schema-registry
            - name: SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS
              value: PLAINTEXT://kantrip-kafka-bootstrap:9097
            - name: SCHEMA_REGISTRY_KAFKASTORE_TOPIC
              value: schema-registry
            - name: SCHEMA_REGISTRY_KAFKASTORE_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: SCHEMA_REGISTRY_SCHEMA_REGISTRY_GROUP_ID
              value: schema-registry-baseline
            - name: SCHEMA_REGISTRY_LISTENERS
              value: http://0.0.0.0:8081
          ports:
            - name: http
              containerPort: 8081
          readinessProbe:
            httpGet:
              port: http
              path: /subjects
            initialDelaySeconds: 15
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 768Mi
---
apiVersion: v1
kind: Service
metadata:
  name: schema-registry
  namespace: kantrip-sandbox
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: schema-registry
  ports:
    - name: http
      port: 8081
      targetPort: http
      nodePort: 30081
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: schema-registry-secure
  namespace: kantrip-sandbox
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: schema-registry-secure
  template:
    metadata:
      labels:
        app.kubernetes.io/name: schema-registry-secure
    spec:
      enableServiceLinks: false
      initContainers:
        - name: build-https-keystore
          image: quay.io/strimzi/kafka:${STRIMZI_VERSION}-kafka-${KAFKA_VERSION}
          command:
            - /bin/sh
            - -ec
          args:
            - |
              openssl pkcs12 -export -in /source/tls.crt -inkey /source/tls.key \
                -out /keystore/registry.p12 -name schema-registry \
                -passout pass:sandbox-only
              keytool -importcert -noprompt -alias sandbox-root \
                -file /ca/ca.crt -keystore /keystore/ca.p12 \
                -storetype PKCS12 -storepass sandbox-only
              chmod 0644 /keystore/registry.p12 /keystore/ca.p12
          volumeMounts:
            - name: tls
              mountPath: /source
              readOnly: true
            - name: ca
              mountPath: /ca
              readOnly: true
            - name: keystore
              mountPath: /keystore
      containers:
        - name: schema-registry
          image: confluentinc/cp-schema-registry:${SCHEMA_REGISTRY_VERSION}
          env:
            - name: SCHEMA_REGISTRY_HOST_NAME
              value: schema-registry-secure
            - name: SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS
              value: PLAINTEXT://kantrip-kafka-bootstrap:9097
            - name: SCHEMA_REGISTRY_KAFKASTORE_TOPIC
              value: schema-registry-secure
            - name: SCHEMA_REGISTRY_KAFKASTORE_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: SCHEMA_REGISTRY_SCHEMA_REGISTRY_GROUP_ID
              value: schema-registry-secure
            - name: SCHEMA_REGISTRY_LISTENERS
              value: https://0.0.0.0:8081
            - name: SCHEMA_REGISTRY_INTER_INSTANCE_PROTOCOL
              value: https
            - name: SCHEMA_REGISTRY_SSL_KEYSTORE_TYPE
              value: PKCS12
            - name: SCHEMA_REGISTRY_SSL_KEYSTORE_LOCATION
              value: /etc/registry-keystore/registry.p12
            - name: SCHEMA_REGISTRY_SSL_KEYSTORE_PASSWORD
              value: sandbox-only
            - name: SCHEMA_REGISTRY_SSL_KEY_PASSWORD
              value: sandbox-only
            - name: SCHEMA_REGISTRY_SSL_TRUSTSTORE_TYPE
              value: PKCS12
            - name: SCHEMA_REGISTRY_SSL_TRUSTSTORE_LOCATION
              value: /etc/registry-keystore/ca.p12
            - name: SCHEMA_REGISTRY_SSL_TRUSTSTORE_PASSWORD
              value: sandbox-only
            - name: SCHEMA_REGISTRY_AUTHENTICATION_METHOD
              value: BASIC
            - name: SCHEMA_REGISTRY_AUTHENTICATION_REALM
              value: SchemaRegistry-Props
            - name: SCHEMA_REGISTRY_AUTHENTICATION_ROLES
              value: developer
            - name: SCHEMA_REGISTRY_OPTS
              value: -Djava.security.auth.login.config=/etc/schema-registry-auth/jaas.conf
          ports:
            - name: https
              containerPort: 8081
          readinessProbe:
            tcpSocket:
              port: https
            initialDelaySeconds: 15
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 768Mi
          volumeMounts:
            - name: auth
              mountPath: /etc/schema-registry-auth
              readOnly: true
            - name: ca
              mountPath: /etc/sandbox-ca
              readOnly: true
            - name: keystore
              mountPath: /etc/registry-keystore
              readOnly: true
      volumes:
        - name: auth
          secret:
            secretName: schema-registry-auth
        - name: ca
          secret:
            secretName: sandbox-root-ca
            items:
              - key: ca.crt
                path: ca.crt
        - name: tls
          secret:
            secretName: registries-tls
        - name: keystore
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: schema-registry-secure
  namespace: kantrip-sandbox
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: schema-registry-secure
  ports:
    - name: https
      port: 8081
      targetPort: https
      nodePort: 30083
---
