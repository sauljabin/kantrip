            - name: keystore
              mountPath: /etc/registry-keystore
              readOnly: true
      volumes:
        - name: ca
          secret:
            secretName: sandbox-root-ca
            items:
              - key: ca.crt
                path: ca.crt
        - name: tls
          secret:
