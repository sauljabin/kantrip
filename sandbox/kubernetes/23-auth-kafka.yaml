apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-kafka
  namespace: kantrip-sandbox
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-kafka
  template:
    metadata:
      labels:
        app: auth-kafka
    spec:
      containers:
        - name: kafka
          image: quay.io/strimzi/kafka:${STRIMZI_VERSION}-kafka-${KAFKA_VERSION}
          command:
            - /bin/bash
            - -ceu
          args:
            - |
              rm -rf /work/logs /work/process-logs /work/server.p12 /work/truststore.p12 /work/server.properties
              export LOG_DIR=/work/process-logs
              mkdir -p "$LOG_DIR"
              openssl pkcs12 -export \
                -in /tls/tls.crt -inkey /tls/tls.key \
                -out /work/server.p12 -passout "pass:$KEYSTORE_PASSWORD"
              keytool -importcert -noprompt -alias sandbox-ca \
                -file /tls/ca.crt -keystore /work/truststore.p12 \
                -storetype PKCS12 -storepass "$KEYSTORE_PASSWORD"
              cat > /work/server.properties <<EOF
              process.roles=broker,controller
              node.id=1
              controller.quorum.bootstrap.servers=localhost:9091
              controller.listener.names=CONTROLLER
              listeners=CONTROLLER://:9091,INTERNAL://:9092,PLAIN://:9097,SCRAM256://:9098
              advertised.listeners=INTERNAL://auth-kafka:9092,PLAIN://localhost:9097,SCRAM256://localhost:9098
              listener.security.protocol.map=CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,PLAIN:SASL_SSL,SCRAM256:SASL_SSL
              inter.broker.listener.name=INTERNAL
              log.dirs=/work/logs
              num.partitions=1
              auto.create.topics.enable=false
              offsets.topic.replication.factor=1
              transaction.state.log.replication.factor=1
              transaction.state.log.min.isr=1
              authorizer.class.name=org.apache.kafka.metadata.authorizer.StandardAuthorizer
              allow.everyone.if.no.acl.found=false
              super.users=User:ANONYMOUS;User:$PLAIN_USERNAME;User:$SCRAM_USERNAME
              sasl.enabled.mechanisms=PLAIN,SCRAM-SHA-256
              listener.name.plain.sasl.enabled.mechanisms=PLAIN
              listener.name.scram256.sasl.enabled.mechanisms=SCRAM-SHA-256
              listener.name.plain.plain.sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required user_$PLAIN_USERNAME="$PLAIN_PASSWORD" user_$NO_ACL_USERNAME="$NO_ACL_PASSWORD";
              listener.name.scram256.scram-sha-256.sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required;
              ssl.keystore.type=PKCS12
              ssl.keystore.location=/work/server.p12
              ssl.keystore.password=$KEYSTORE_PASSWORD
              ssl.key.password=$KEYSTORE_PASSWORD
              ssl.truststore.type=PKCS12
              ssl.truststore.location=/work/truststore.p12
              ssl.truststore.password=$KEYSTORE_PASSWORD
              ssl.client.auth=none
              EOF
              cluster_id="$(/opt/kafka/bin/kafka-storage.sh random-uuid)"
              /opt/kafka/bin/kafka-storage.sh format --standalone \
                -t "$cluster_id" -c /work/server.properties \
                --add-scram "SCRAM-SHA-256=[name=$SCRAM_USERNAME,password=$SCRAM_PASSWORD]" \
                --add-scram "SCRAM-SHA-256=[name=$NO_ACL_USERNAME,password=$NO_ACL_PASSWORD]"
              exec /opt/kafka/bin/kafka-server-start.sh /work/server.properties
          env:
            - name: PLAIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: auth-kafka-users
                  key: plain-username
            - name: PLAIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: auth-kafka-users
                  key: plain-password
            - name: SCRAM_USERNAME
              valueFrom:
                secretKeyRef:
                  name: auth-kafka-users
                  key: scram-256-username
            - name: SCRAM_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: auth-kafka-users
                  key: scram-256-password
            - name: NO_ACL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: auth-kafka-users
                  key: no-acl-username
            - name: NO_ACL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: auth-kafka-users
                  key: no-acl-password
            - name: KEYSTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: auth-kafka-users
                  key: plain-password
          ports:
            - name: plain
              containerPort: 9097
            - name: scram256
              containerPort: 9098
          readinessProbe:
            tcpSocket:
              port: plain
            initialDelaySeconds: 5
            periodSeconds: 2
          volumeMounts:
            - name: tls
              mountPath: /tls
              readOnly: true
            - name: work
              mountPath: /work
      volumes:
        - name: tls
          secret:
            secretName: kafka-listeners-tls
            items:
              - key: tls.crt
                path: tls.crt
              - key: tls.key
                path: tls.key
              - key: ca.crt
                path: ca.crt
        - name: work
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: auth-kafka
  namespace: kantrip-sandbox
spec:
  type: NodePort
  selector:
    app: auth-kafka
  ports:
    - name: plain
      port: 9097
      targetPort: plain
      nodePort: 30097
    - name: scram256
      port: 9098
      targetPort: scram256
      nodePort: 30098
